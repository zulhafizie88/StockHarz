name: Check a stock's fair value

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: Tickers, separated by commas
        default: EOG

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock jsdom@24.1.3
      - env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SYMBOLS: ${{ inputs.symbols }}
        run: node scripts/check-stock.mjs
